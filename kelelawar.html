<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Kelelawar Gua</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
            position: relative;
        }
        canvas {
            border: 4px solid #444;
            background-color: #0b0d1b;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Data Kelelawar
const bat = {
    x: 50,
    y: 300,
    width: 30,
    height: 20,
    gravity: 0.35,
    lift: -7.5,
    velocity: 0,
    wingAngle: 0
};

// Data Game
let score = 0;
let highScore = 0;
let gameOver = false;
let gameStarted = false;
let frameCount = 0;

// Data Rintangan (Batu Gua)
const obstacles = [];
const obstacleWidth = 50;
const obstacleGap = 160;

// Kontrol Pemain
function flap() {
    if (!gameStarted) {
        gameStarted = true;
    }
    if (gameOver) {
        resetGame();
    } else {
        bat.velocity = bat.lift;
    }
}

document.addEventListener("keydown", (e) => {
    if (e.code === "Space") flap();
});
canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    flap();
});
canvas.addEventListener("mousedown", flap);

function resetGame() {
    bat.y = 300;
    bat.velocity = 0;
    obstacles.length = 0;
    score = 0;
    gameOver = false;
    gameStarted = true;
}

// Menambah Rintangan Baru
function spawnObstacle() {
    const minHeight = 50;
    const maxHeight = canvas.height - obstacleGap - minHeight;
    const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

    obstacles.push({
        x: canvas.width,
        top: topHeight,
        bottom: canvas.height - topHeight - obstacleGap,
        passed: false
    });
}

// Pembaruan Logika Game
function update() {
    if (!gameStarted || gameOver) return;

    frameCount++;

    // Gerakan Kelelawar
    bat.velocity += bat.gravity;
    bat.y += bat.velocity;
    bat.wingAngle = Math.sin(frameCount * 0.2) * 10;

    // Batas Layar
    if (bat.y + bat.height >= canvas.height || bat.y <= 0) {
        gameOver = true;
    }

    // Kelola Rintangan
    if (frameCount % 100 === 0) {
        spawnObstacle();
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= 2.5;

        // Cek Kolisi (Tabrakan)
        if (
            bat.x < obs.x + obstacleWidth &&
            bat.x + bat.width > obs.x &&
            (bat.y < obs.top || bat.y + bat.height > canvas.height - obs.bottom)
        ) {
            gameOver = true;
        }

        // Tambah Skor
        if (obs.x + obstacleWidth < bat.x && !obs.passed) {
            score++;
            obs.passed = true;
            if (score > highScore) highScore = score;
        }

        // Hapus Rintangan di Luar Layar
        if (obs.x + obstacleWidth < 0) {
            obstacles.splice(i, 1);
        }
    }
}

// Menggambar Visual Game
function draw() {
    // Latar Belakang Gua
    ctx.fillStyle = "#0b0d1b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Gambar Rintangan (Stalaktit & Stalagmit Gua)
    ctx.fillStyle = "#3d354b";
    for (const obs of obstacles) {
        // Bagian Atas
        ctx.fillRect(obs.x, 0, obstacleWidth, obs.top);
        // Bagian Bawah
        ctx.fillRect(obs.x, canvas.height - obs.bottom, obstacleWidth, obs.bottom);
    }

    // Gambar Kelelawar
    ctx.save();
    ctx.translate(bat.x + bat.width / 2, bat.y + bat.height / 2);
    
    // Badan
    ctx.fillStyle = "#8b7d93";
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Kepala & Telinga
    ctx.fillStyle = "#63566c";
    ctx.beginPath();
    ctx.arc(6, -4, 5, 0, Math.PI * 2);
    ctx.fill();

    // Sayap (Animasi mengepak)
    ctx.fillStyle = "#4a3b53";
    ctx.beginPath();
    ctx.moveTo(-2, 0);
    ctx.lineTo(-12, -12 + bat.wingAngle);
    ctx.lineTo(-4, 4);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(2, 0);
    ctx.lineTo(12, -12 + bat.wingAngle);
    ctx.lineTo(4, 4);
    ctx.fill();

    ctx.restore();

    // Tampilan Skor
    ctx.fillStyle = "#ffffff";
    ctx.font = "20px Arial";
    ctx.fillText(`Skor: ${score}`, 10, 30);
    ctx.fillText(`Skor Tertinggi: ${highScore}`, 10, 60);

    // Pesan Mulai / Game Over
    if (!gameStarted) {
        ctx.fillStyle = "#ffffff";
        ctx.font = "22px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Tekan SPASI / Klik untuk Terbang", canvas.width / 2, canvas.height / 2);
    } else if (gameOver) {
        ctx.fillStyle = "#ff5555";
        ctx.font = "30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#ffffff";
        ctx.font = "18px Arial";
        ctx.fillText("Tekan SPASI / Klik untuk Main Lagi", canvas.width / 2, canvas.height / 2 + 20);
    }

    ctx.textAlign = "left";
}

// Loop Utama Game
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
